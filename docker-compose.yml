# Base local de desarrollo: Postgres 18 + Flyway (migrations/ + seeds/dev/).
# Solo desarrollo: credenciales fijas, nunca usar contra RDS.
name: cuy-monitor-db

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cuymonitor
      POSTGRES_USER: cuymonitor
      POSTGRES_PASSWORD: cuymonitor
    ports:
      - "5432:5432"
    volumes:
      # Formato de Postgres 18: el volumen va en /var/lib/postgresql, NO en .../data
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuymonitor -d cuymonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11.20.3-alpine
    depends_on:
      postgres:
        condition: service_healthy
    # ":z" relabels the folders for SELinux (Fedora, RHEL): without it Flyway can't read them ("not readable")
    # and stops with "Detected applied migration not resolved locally". Ignored where SELinux is off.
    volumes:
      - ./migrations:/flyway/sql/migrations:ro,z
      - ./seeds/dev:/flyway/sql/seeds:ro,z
      - ./flyway.conf:/flyway/conf/flyway.conf:ro,z
    # connection in env vars, not in "command", so "docker compose run --rm flyway info|validate" keeps it
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/cuymonitor
      FLYWAY_USER: cuymonitor
      FLYWAY_PASSWORD: cuymonitor
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/seeds
    command: migrate

volumes:
  pgdata-dev:
